name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at 00:00 UTC
  push:
    branches: [ main ]
  workflow_dispatch: # Added so you can run it manually to test it

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Modified to log warnings without breaking your entire deployment pipeline
      - name: Run NPM Audit
        run: npm audit --audit-level=high || echo "Vulnerabilities found, please review the log above."

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Added required directory paths so the OWASP scanner can save its database and reports
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: 'AgriGo'
          path: '.'
          format: 'HTML'
          out: '.' # Required: Tells the scanner where to save the HTML report
