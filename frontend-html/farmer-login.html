<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>AgriGo — किसान लॉगिन (Farmer Login)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #F0FDF4;
      background-image: radial-gradient(ellipse at 50% 0%, #BBF7D0 0%, #DCFCE7 30%, #F0FDF4 65%, #FEFCE8 100%);
      background-attachment: fixed;
      font-family: 'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #14532D;
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height for mobile browsers */
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* Ambient Elliptical Background Shapes — clipped to viewport */
    .bg-ellipse-1 {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100vw);
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.25) 0%, rgba(34, 197, 94, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-ellipse-2 {
      position: fixed;
      bottom: -150px;
      right: -50px;
      width: min(500px, 80vw);
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.3) 0%, rgba(254, 240, 138, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container — fills full width, vertically centers the card */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* Combined Rectangular & Elliptical Card */
    .kisan-login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: 24px;
      border: 1.5px solid #86EFAC;
      box-shadow: 0 20px 45px rgba(22, 101, 52, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
      padding: 32px 28px 28px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative Elliptical Accent at Card Top */
    .card-top-ellipse {
      position: absolute;
      top: -90px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(74, 222, 128, 0.25) 0%, rgba(240, 253, 244, 0) 100%);
      pointer-events: none;
    }

    /* Elliptical Badge at Top of Card */
    .ellipse-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #F0FDF4;
      border: 1.5px solid #86EFAC;
      color: #15803D;
      padding: 6px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      margin: 0 auto 12px auto;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      color: #14532D;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: -0.2px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #4B7A58;
      text-align: center;
      margin-bottom: 24px;
    }

    /* Form Fields */
    .field-box {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #166534;
      margin-bottom: 8px;
    }

    .input-pill-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .prefix-pill {
      position: absolute;
      left: 14px;
      font-size: 14.5px;
      font-weight: 800;
      color: #15803D;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      z-index: 2;
    }

    /* Rectangular Inputs with Elliptical Pill Rounded Form */
    .kisan-input {
      width: 100%;
      height: 52px;
      font-size: 16px;
      font-family: inherit;
      padding: 12px 18px;
      background: #F9FCF9;
      border: 1.5px solid #86EFAC;
      border-radius: 999px;
      color: #143521;
      transition: all 0.2s ease;
      outline: none;
      -webkit-appearance: none;
    }

    .kisan-input.phone-input {
      padding-left: 78px;
      font-size: 17.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .kisan-input:focus {
      border-color: #16A34A;
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    /* Password Reveal Toggle */
    .pass-toggle-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 6px 12px;
      color: #64748B;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Forgot Password Link Row */
    .forgot-pass-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
      padding-right: 8px;
    }

    .forgot-pass-link {
      background: none;
      border: none;
      color: #15803D;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      padding: 4px;
      transition: color 0.15s;
    }

    .forgot-pass-link:hover {
      color: #0F5132;
      text-decoration: underline;
    }

    /* Elliptical Primary Button */
    .btn-kisan-submit {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #16A34A 0%, #15803D 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      font-size: 16.5px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.35);
      margin-top: 14px;
    }

    .btn-kisan-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(22, 163, 74, 0.45);
    }

    .btn-kisan-submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-kisan-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Alerts — use rounded-rect on mobile so long text doesn't break */
    .pos-alert {
      border-radius: 16px;
      padding: 10px 18px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 18px;
      text-align: center;
      display: none;
      animation: fadeIn 0.25s ease-out;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pos-alert.success {
      background: #ECFDF5;
      border: 1.5px solid #6EE7B7;
      color: #065F46;
      font-weight: 700;
    }

    .pos-alert.error {
      background: #FEF2F2;
      border: 1.5px solid #FCA5A5;
      color: #991B1B;
      font-weight: 700;
    }

    /* Card Footer Links */
    .card-footer-nav {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-footer-nav a {
      color: #15803D;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.15s;
    }

    .card-footer-nav a:hover {
      text-decoration: underline;
      color: #0F5132;
    }

    /* =============================================
       RESPONSIVE — MOBILE FIRST (≤ 480px)
       ============================================= */
    @media (max-width: 480px) {
      .login-wrapper {
        padding: 12px 0 0 0;
        align-items: flex-start;
      }

      .kisan-login-card {
        max-width: 100%;
        border-radius: 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        box-shadow: none;
        padding: 28px 20px 24px;
        min-height: calc(100vh - 120px);
        min-height: calc(100dvh - 120px);
        display: flex;
        flex-direction: column;
      }

      /* Let the form area push footer to bottom */
      .kisan-login-card form {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .kisan-login-card form .btn-kisan-submit {
        margin-top: auto;
        /* ensure at least some gap above button */
        margin-top: 24px;
      }

      .card-title {
        font-size: 20px;
      }

      .card-subtitle {
        font-size: 12.5px;
        margin-bottom: 20px;
      }

      .kisan-input {
        height: 50px;
      }

      .kisan-input.phone-input {
        font-size: 16px;
        padding-left: 72px;
      }

      .prefix-pill {
        font-size: 13.5px;
      }

      .btn-kisan-submit {
        height: 50px;
        font-size: 15.5px;
      }

      .ellipse-badge {
        font-size: 12.5px;
        padding: 5px 16px;
      }

      /* Hide decorative ellipses on mobile to prevent overflow */
      .bg-ellipse-1,
      .bg-ellipse-2 {
        display: none;
      }

      .card-top-ellipse {
        display: none;
      }
    }

    /* Small phones (≤ 360px) */
    @media (max-width: 360px) {
      .kisan-login-card {
        padding: 24px 16px 20px;
      }

      .card-title {
        font-size: 18px;
      }

      .kisan-input.phone-input {
        font-size: 15px;
        padding-left: 68px;
      }

      .btn-kisan-submit {
        font-size: 14.5px;
        height: 48px;
      }

      .forgot-pass-link {
        font-size: 11.5px;
      }

      .card-footer-nav {
        font-size: 11.5px;
        justify-content: center;
        gap: 14px;
      }
    }

    /* Tablets (481px — 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      .login-wrapper {
        padding: 24px 24px 40px;
      }

      .kisan-login-card {
        max-width: 440px;
      }
    }

    /* Desktop (≥ 769px) */
    @media (min-width: 769px) {
      .login-wrapper {
        padding: 48px 32px 64px;
      }

      .kisan-login-card {
        max-width: 440px;
        border-radius: 28px;
        padding: 40px 36px 34px;
      }

      .card-title {
        font-size: 24px;
      }

      .kisan-input {
        height: 54px;
      }

      .btn-kisan-submit {
        height: 54px;
        font-size: 17px;
      }
    }

    /* Wide Desktop (≥ 1200px) */
    @media (min-width: 1200px) {
      .kisan-login-card {
        max-width: 460px;
        padding: 44px 40px 36px;
      }
    }

    /* Landscape phone fix */
    @media (max-height: 500px) and (orientation: landscape) {
      .login-wrapper {
        align-items: flex-start;
        padding: 12px 16px;
      }

      .kisan-login-card {
        min-height: auto;
      }
    }
  </style>
</head>
<body data-page="farmer">

  <!-- Background Elliptical Glows -->
  <div class="bg-ellipse-1"></div>
  <div class="bg-ellipse-2"></div>

  <!-- Universal Header -->
  <div id="site-header-mount"></div>

  <!-- Center Content Wrapper -->
  <main class="login-wrapper">
    <div class="kisan-login-card">
      <div class="card-top-ellipse"></div>

      <!-- Elliptical Pill Header Badge -->
      <div style="text-align: center;">
        <div class="ellipse-badge">
          <span>🌾</span>
          <span>किसान लॉगिन • Farmer Login</span>
        </div>
      </div>

      <h1 class="card-title">नमस्ते किसान भाई!</h1>
      <p class="card-subtitle">अपने पंजीकृत मोबाइल नंबर से प्रवेश करें</p>

      <!-- Feedback Alerts -->
      <div id="login-alert-success" class="pos-alert success"></div>
      <div id="login-alert-error"   class="pos-alert error"></div>

      <!-- Login Form (Only Number, Password, and Forgot Password) -->
      <form id="farmer-login-form" onsubmit="handleFarmerSubmit(event)">
        <!-- 1. Number Section -->
        <div class="field-box">
          <label for="farmer-phone" class="field-label">मोबाइल नंबर (Mobile Number)</label>
          <div class="input-pill-wrapper">
            <span class="prefix-pill">🇮🇳 +91</span>
            <input 
              type="tel" 
              id="farmer-phone" 
              class="kisan-input phone-input" 
              placeholder="9876543210" 
              maxlength="10" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              autocomplete="tel"
              required
              oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10);"
              onkeypress="return (event.charCode >= 48 && event.charCode <= 57)"
            >
          </div>
        </div>

        <!-- 2. Password Section -->
        <div class="field-box" style="margin-bottom: 8px;">
          <label for="farmer-pass" class="field-label">पासवर्ड (Password)</label>
          <div class="input-pill-wrapper">
            <input 
              type="password" 
              id="farmer-pass" 
              class="kisan-input" 
              placeholder="अपना पासवर्ड दर्ज करें" 
              autocomplete="current-password"
            >
            <button type="button" class="pass-toggle-btn" onclick="togglePassVisibility('farmer-pass', this)" title="पासवर्ड देखें">
              👁️
            </button>
          </div>
          <!-- 3. Forgot Password Link -->
          <div class="forgot-pass-row">
            <button type="button" class="forgot-pass-link" onclick="openForgotPassModal()">
              🔑 पासवर्ड भूल गए? (Forgot Password?)
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-login-submit" class="btn-kisan-submit">
          <span>🌾</span>
          <span id="btn-submit-text">खेत में प्रवेश करें ➔</span>
        </button>
      </form>

      <!-- Minimal Sub Links -->
      <div class="card-footer-nav">
        <a href="register.html">
          🌱 नया पंजीकरण (Register)
        </a>
        <a href="index.html">
          🏠 मुख्य पृष्ठ (Home)
        </a>
      </div>

    </div>
  </main>

  <!-- Forgot Password Recovery Modal (Security Question Based) -->
  <div id="forgot-pass-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center; padding:0; backdrop-filter:blur(4px);">
    <div style="background:#FFFFFF; border-radius:24px; border:1.5px solid #86EFAC; box-shadow:0 20px 50px rgba(0,0,0,0.25); max-width:420px; width:calc(100% - 32px); margin:16px auto; padding:28px 24px; position:relative; max-height:90vh; overflow-y:auto;">
      <!-- Close button -->
      <button type="button" onclick="closeForgotPassModal()" style="position:absolute; top:16px; right:16px; background:#F0FDF4; border:none; border-radius:50%; width:34px; height:34px; font-size:18px; cursor:pointer; color:#15803D; display:flex; align-items:center; justify-content:center;" title="बंद करें">✕</button>

      <div style="text-align:center; margin-bottom:18px;">
        <div class="ellipse-badge" style="margin-bottom:8px;">
          <span>🔐 पासवर्ड पुनर्प्राप्ति</span>
        </div>
        <p style="font-size:12.5px; color:#4B7A58;">पंजीकृत सुरक्षा प्रश्न द्वारा नया पासवर्ड सेट करें</p>
      </div>

      <div id="fp-alert-error" class="pos-alert error" style="display:none;"></div>
      <div id="fp-alert-success" class="pos-alert success" style="display:none;"></div>

      <!-- STEP 1: Phone input -->
      <div id="fp-step-1">
        <div class="field-box">
          <label class="field-label">पंजीकृत मोबाइल नंबर</label>
          <div class="input-pill-wrapper">
            <span class="prefix-pill">🇮🇳 +91</span>
            <input 
              type="tel" 
              id="fp-phone" 
              class="kisan-input phone-input" 
              placeholder="9876543210" 
              maxlength="10" 
              inputmode="numeric" 
              pattern="[0-9]*"
              oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10);"
              onkeypress="return (event.charCode >= 48 && event.charCode <= 57)"
            >
          </div>
        </div>
        <button type="button" id="fp-btn-fetch" class="btn-kisan-submit" onclick="handleFetchSecurityQuestion()">
          <span>🔍</span> <span>सुरक्षा प्रश्न प्राप्त करें ➔</span>
        </button>
      </div>

      <!-- STEP 2: Answer question & set password -->
      <div id="fp-step-2" style="display:none;">
        <div style="background:#F0FDF4; border:1.5px dashed #86EFAC; border-radius:16px; padding:12px 14px; margin-bottom:16px;">
          <div style="font-size:11.5px; font-weight:700; color:#15803D; text-transform:uppercase;">सुरक्षा प्रश्न:</div>
          <div id="fp-question-display" style="font-size:14px; font-weight:800; color:#14532D; margin-top:4px;"></div>
        </div>

        <div class="field-box">
          <label class="field-label">गोपनीय उत्तर</label>
          <input type="text" id="fp-answer" class="kisan-input" placeholder="सुरक्षा प्रश्न का उत्तर" autocomplete="off">
        </div>

        <div class="field-box">
          <label class="field-label">नया पासवर्ड</label>
          <input type="password" id="fp-new-pass" class="kisan-input" placeholder="कम से कम 6 अक्षर" autocomplete="new-password">
        </div>

        <div class="field-box">
          <label class="field-label">नया पासवर्ड दोबारा लिखें</label>
          <input type="password" id="fp-confirm-pass" class="kisan-input" placeholder="नया पासवर्ड पुनः लिखें" autocomplete="new-password">
        </div>

        <button type="button" id="fp-btn-submit" class="btn-kisan-submit" onclick="handleResetPasswordSubmit()">
          <span>✓</span> <span>नया पासवर्ड सुरक्षित करें ➔</span>
        </button>

        <button type="button" class="btn-kisan-submit" onclick="backToStep1()" style="background:#FFFFFF; color:#15803D; border:1.5px solid #86EFAC; box-shadow:none; margin-top:10px;">
          <span>⬅️</span> <span>नंबर बदलें (Back)</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Universal Footer -->
  <footer style="text-align: center; padding: 14px 16px; color: #166534; font-size: 12px; background: #DCFCE7; border-top: 1px solid rgba(34, 197, 94, 0.2); width: 100%; flex-shrink: 0;">
    AgriGo AI • जय जवान, जय किसान • 2026
  </footer>

  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/header.js"></script>
  <script>
    let activeFpPhone = "";

    // Redirect if already authenticated
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("logged_out")) {
        showAlert("success", "✅ आप सफलतापूर्वक लॉगआउट हो चुके हैं।");
        return;
      }
      try {
        if (window.AgriAPI && window.AgriAPI.getMe) {
          const me = await window.AgriAPI.getMe();
          if (me && me.authenticated && me.user) {
            window.location.replace("farmer.html");
          }
        }
      } catch (_) {}
    });

    // Password Eye Toggle
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "👁️";
      }
    }

    // Alerts
    function showAlert(type, msg) {
      const s = document.getElementById("login-alert-success");
      const e = document.getElementById("login-alert-error");
      if (s) s.style.display = "none";
      if (e) e.style.display = "none";

      if (type === "success" && s) {
        s.textContent = msg;
        s.style.display = "block";
      } else if (e) {
        e.textContent = msg;
        e.style.display = "block";
      }
    }

    // Submit Handler
    async function handleFarmerSubmit(event) {
      event.preventDefault();
      const phoneInput = document.getElementById("farmer-phone");
      const passInput = document.getElementById("farmer-pass");
      const btn = document.getElementById("btn-login-submit");
      const btnText = document.getElementById("btn-submit-text");

      const phone = phoneInput ? phoneInput.value.replace(/\D/g, "").slice(0, 10) : "";
      const pass = passInput ? passInput.value.trim() : "";

      if (!phone || phone.length !== 10) {
        showAlert("error", "कृपया 10-अंकों का मान्य मोबाइल नंबर दर्ज करें।");
        if (phoneInput) phoneInput.focus();
        return;
      }

      btn.disabled = true;
      btnText.textContent = "प्रवेश हो रहा है... 🌱";

      try {
        let res;
        if (pass) {
          res = await AgriAPI.farmerDirectLogin(phone, pass);
        } else {
          // If password is not provided, seamlessly quick-login
          res = await AgriAPI.quickMobileLogin(phone);
        }

        showAlert("success", (res.message || "स्वागत है किसान भाई!") + " डैशबोर्ड लोड हो रहा है...");
        setTimeout(() => {
          window.location.href = "farmer.html";
        }, 300);
      } catch (err) {
        btn.disabled = false;
        btnText.textContent = "खेत में प्रवेश करें ➔";
        showAlert("error", err.message || "लॉगिन विफल रहा। कृपया विवरण जांचें।");
      }
    }

    // ----------------- Forgot Password Modal Handlers -----------------
    function openForgotPassModal() {
      const m = document.getElementById("forgot-pass-modal");
      if (m) {
        m.style.display = "flex";
        const curPhone = document.getElementById("farmer-phone")?.value || "";
        if (curPhone) {
          const fp = document.getElementById("fp-phone");
          if (fp) fp.value = curPhone;
        }
        backToStep1();
      }
    }

    function closeForgotPassModal() {
      const m = document.getElementById("forgot-pass-modal");
      if (m) m.style.display = "none";
      clearFpAlerts();
    }

    function backToStep1() {
      const s1 = document.getElementById("fp-step-1");
      const s2 = document.getElementById("fp-step-2");
      if (s1) s1.style.display = "block";
      if (s2) s2.style.display = "none";
      clearFpAlerts();
    }

    function showFpAlert(type, msg) {
      const e = document.getElementById("fp-alert-error");
      const s = document.getElementById("fp-alert-success");
      clearFpAlerts();
      if (type === "error" && e) {
        e.textContent = msg;
        e.style.display = "block";
      } else if (type === "success" && s) {
        s.textContent = msg;
        s.style.display = "block";
      }
    }

    function clearFpAlerts() {
      const e = document.getElementById("fp-alert-error");
      const s = document.getElementById("fp-alert-success");
      if (e) e.style.display = "none";
      if (s) s.style.display = "none";
    }

    async function handleFetchSecurityQuestion() {
      clearFpAlerts();
      const phoneInput = document.getElementById("fp-phone");
      const phone = phoneInput ? phoneInput.value.replace(/\D/g, "").slice(0, 10) : "";

      if (!phone || phone.length !== 10) {
        showFpAlert("error", "कृपया 10-अंकों का मान्य मोबाइल नंबर दर्ज करें।");
        return;
      }

      const btn = document.getElementById("fp-btn-fetch");
      btn.disabled = true;
      btn.innerHTML = "<span>⏳</span> <span>सुरक्षा प्रश्न खोजा जा रहा है...</span>";

      try {
        const res = await AgriAPI.getSecurityQuestion(phone);
        activeFpPhone = phone;
        document.getElementById("fp-question-display").textContent = res.question;
        document.getElementById("fp-step-1").style.display = "none";
        document.getElementById("fp-step-2").style.display = "block";
        document.getElementById("fp-answer").value = "";
        document.getElementById("fp-new-pass").value = "";
        document.getElementById("fp-confirm-pass").value = "";
      } catch (e) {
        showFpAlert("error", e.message || "सुरक्षा प्रश्न प्राप्त नहीं हो सका। कृपया जांचें कि नंबर सही है।");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>🔍</span> <span>सुरक्षा प्रश्न प्राप्त करें ➔</span>";
      }
    }

    async function handleResetPasswordSubmit() {
      clearFpAlerts();
      const answer = document.getElementById("fp-answer")?.value?.trim();
      const newPass = document.getElementById("fp-new-pass")?.value;
      const confirmPass = document.getElementById("fp-confirm-pass")?.value;

      if (!answer) {
        showFpAlert("error", "कृपया सुरक्षा प्रश्न का उत्तर दर्ज करें।");
        return;
      }
      if (!newPass || newPass.length < 6) {
        showFpAlert("error", "नया पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।");
        return;
      }
      if (newPass !== confirmPass) {
        showFpAlert("error", "दोनों पासवर्ड मेल नहीं खा रहे हैं।");
        return;
      }

      const btn = document.getElementById("fp-btn-submit");
      btn.disabled = true;
      btn.innerHTML = "<span>⏳</span> <span>पासवर्ड बदला जा रहा है...</span>";

      try {
        const res = await AgriAPI.resetPasswordWithSecurity(activeFpPhone, answer, newPass);
        showFpAlert("success", res.message || "पासवर्ड सफलतापूर्वक बदल दिया गया!");
        setTimeout(() => {
          closeForgotPassModal();
          const mainPhone = document.getElementById("farmer-phone");
          if (mainPhone) mainPhone.value = activeFpPhone;
          const mainPass = document.getElementById("farmer-pass");
          if (mainPass) {
            mainPass.value = newPass;
            mainPass.focus();
          }
          showAlert("success", "✅ नया पासवर्ड सेट हो गया! अब प्रवेश करें।");
        }, 1200);
      } catch (e) {
        showFpAlert("error", e.message || "पासवर्ड रीसेट विफल रहा। कृपया उत्तर जांचें।");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>✓</span> <span>नया पासवर्ड सुरक्षित करें ➔</span>";
      }
    }
  </script>
</body>
</html>
